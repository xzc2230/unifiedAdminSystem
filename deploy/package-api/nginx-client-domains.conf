# Client-doc domains behind Cloudflare. Append to /opt/unifiedAdminSystem/nginx.conf.
# Apex names return an empty page. Any one-label subdomain serves the thirteen
# documented client interfaces. Exact www.attrnivo.com and apivo.attrnivo.com
# servers stay more specific than *.attrnivo.com. The origin reuses the existing
# certificate; Cloudflare presents the public certificate.
# client-doc domains: apex blank, any subdomain serves the thirteen client interfaces
server {
    listen 80;
    listen 443 ssl;
    server_name vexmoriq.com qunavelo.com qirvotex.com lumexavi.com navoriqe.com xelunavogroup.com rovixemu.com attrnivo.com attrluma.com attrpath.com;
    ssl_certificate /etc/letsencrypt/live/www.attrnivo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.attrnivo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / {
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 "";
    }
}
server {
    listen 80;
    listen 443 ssl;
    server_name *.vexmoriq.com *.qunavelo.com *.qirvotex.com *.lumexavi.com *.navoriqe.com *.xelunavogroup.com *.rovixemu.com *.attrnivo.com *.attrluma.com *.attrpath.com;
    ssl_certificate /etc/letsencrypt/live/www.attrnivo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.attrnivo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 21m;

    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    location = /api/v1/attribution/resolve/ { return 404; }
    location = /api/v1/attribution/resolve {
        limit_except POST { deny all; }
        rewrite ^ /jeecg-boot/api/v1/attribution/resolve break;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_redirect off;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location ~* ^/(jeecgboot|jeecg-boot|package-admin|package-legacy|sys|actuator|swagger[^/]*|v3|doc\.html|common|profile|fb|page|loading|pwa|notify|systemSDK)(/|$) { return 404; }
    location ~ "^(/v2/api/banner/list/[^/]+|(?:/[^/]+){1,4})/?$" {
        limit_except GET POST { deny all; }
        rewrite ^/(.*)$ /jeecg-boot/package-legacy/$1 break;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_redirect off;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
