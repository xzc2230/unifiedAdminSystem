# Validated production client API hosts, 2026-11-10. Cloudflare CIDRs are a snapshot.
# Merge into existing nginx.conf; requires ACME and /etc/letsencrypt mounts.
server {
    listen 80;
    server_name apivo.attrnivo.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; default_type text/plain; }
    location / { return 308 https://apivo.attrnivo.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name apivo.attrnivo.com;
    ssl_certificate /etc/letsencrypt/live/apivo.attrnivo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apivo.attrnivo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    client_max_body_size 21m;
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;
    # Token-authenticated OpenAPI, independent of legacy client and admin routes.
    location ~ ^/openapi/manager(?:/|$) {
        rewrite ^/(.*)$ /jeecg-boot/$1 break;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_redirect off;
        proxy_cache off;
        proxy_buffering off;
        add_header Cache-Control "no-store" always;
    }
    # This host publishes only the requested client protocols, not other legacy services.
    location ~* ^/(jeecgboot|jeecg-boot|package-admin|package-legacy|sys|actuator|swagger[^/]*|v3|doc\.html|common|profile|fb|page|loading|pwa|notify|systemSDK)(/|$) { return 404; }
    location ~ "^(/v2/api/banner/list/[^/]+|(?:/[^/]+){1,4})/?$" {
        limit_except GET POST { deny all; }
        rewrite ^/(.*)$ /jeecg-boot/package-legacy/$1 break;
        proxy_pass http://127.0.0.1:18080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Original-URI $request_uri;
        proxy_redirect off;
        proxy_cache off;
        proxy_buffering off;
        proxy_read_timeout 60s;
        add_header Cache-Control "no-store" always;
    }
    location / { return 404; }
}
