map $http_upgrade $jeecg_connection_upgrade {
    default upgrade;
    '' close;
}
server {
    listen 80 default_server;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 10m;
    location ~* ^/(jeecgboot|jeecg-boot)/sys/user/register(?:/|$) { return 403; }
    location ~* ^/(jeecgboot|jeecg-boot)/site-platform/node(?:/|$) { return 403; }
    location ~* ^/(jeecgboot|jeecg-boot)/(airag|jmreport|drag|bigscreen|demo|test|druid|actuator|swagger[^/]*|v3/api-docs)(?:/|$) { return 403; }
    location ~* ^/(jeecgboot|jeecg-boot)/(doc|swagger-ui)\.html$ { return 403; }
    location = /jeecgboot { return 301 /jeecgboot/; }
    location /jeecgboot/ {
        proxy_pass http://127.0.0.1:18080/jeecg-boot/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $jeecg_connection_upgrade;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
        proxy_cache off;
    }
    location /jeecg-boot/ { return 404; }
    location = /_app.config.js {
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }
    location = /index.html {
        add_header Cache-Control 'no-store' always;
        try_files $uri =404;
    }
    location ~* ^/(?!jeecgboot/|jeecg-boot/).+\.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|map)$ {
        try_files $uri =404;
        expires 1h;
    }
    location / { try_files $uri $uri/ /index.html; }
}
