# Import with --spring.config.import=optional:file:./deploy/attribution/attribution.properties
# Public traffic stays off unless explicitly enabled and the application is allowlisted.
attribution.binding.v12.enabled=${ATTRIBUTION_ENABLED:false}
attribution.binding.v12.enabled-applications=${ATTRIBUTION_ENABLED_APPLICATIONS:}
# Exact approved hosts, comma separated. No wildcard; never include localhost/private addresses.
attribution.binding.v12.allowed-hosts=${ATTRIBUTION_ALLOWED_HOSTS:}
# Supply a secret with at least 32 UTF-8 bytes, stored outside source control.
attribution.binding.v12.hmac-key=${ATTRIBUTION_HMAC_KEY:}
attribution.binding.v12.subject-requests-per-minute=${ATTRIBUTION_SUBJECT_RPM:60}
attribution.binding.v12.application-requests-per-minute=${ATTRIBUTION_APP_RPM:1000}
attribution.binding.v12.admin-requests-per-minute=${ATTRIBUTION_ADMIN_RPM:120}
attribution.binding.v12.credential-ttl-seconds=${ATTRIBUTION_CREDENTIAL_TTL_SECONDS:3600}
attribution.binding.v12.token-ttl-seconds=${ATTRIBUTION_TOKEN_TTL_SECONDS:600}
# Empty by default: nonempty real media parameters require a separately verified source.
attribution.binding.v12.trusted-evidence-sources=${ATTRIBUTION_TRUSTED_EVIDENCE_SOURCES:}
